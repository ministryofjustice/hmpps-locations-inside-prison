---
# Per environment values which override defaults in hmpps-locations-inside-prison/values.yaml

generic-service:
  # service account with permission to send to the HMPPS Audit queue (cloud-platform-environments irsa.tf)
  serviceAccountName: "hmpps-locations-inside-prison"

  ingress:
    host: locations-inside-prison.hmpps.service.justice.gov.uk
    annotations:
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"

  env:
    INGRESS_URL: "https://locations-inside-prison.hmpps.service.justice.gov.uk"
    HMPPS_AUTH_URL: "https://sign-in.hmpps.service.justice.gov.uk/auth"

    # APIs
    MANAGE_USERS_API_URL: "https://manage-users-api.hmpps.service.justice.gov.uk"
    TOKEN_VERIFICATION_API_URL: "https://token-verification-api.prison.service.justice.gov.uk"
    COMPONENT_API_URL: "https://frontend-components.hmpps.service.justice.gov.uk"
    LOCATIONS_API_URL: "https://locations-inside-prison-api.hmpps.service.justice.gov.uk"
    PRISON_API_URL: "https://prison-api.prison.service.justice.gov.uk"

    # Service URLs
    DPS_URL: "https://digital.prison.service.justice.gov.uk"
    SERVICE_NON_RESIDENTIAL_LOCATIONS_URL: "https://non-residential-locations.hmpps.service.justice.gov.uk"
    ESTABLISHMENT_ROLL_URL: "https://prison-roll-count.hmpps.service.justice.gov.uk"

    AUDIT_ENABLED: "true"

  namespace_secrets:
    sqs-hmpps-audit-secret:
      AUDIT_SQS_QUEUE_URL: "sqs_queue_url"

generic-prometheus-alerts:
  alertSeverity: move-a-prisoner-alerts-prod
